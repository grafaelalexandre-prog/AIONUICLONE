name: Build Windows Installer

on:
  push:
    branches: [main, 'feat/*']
    tags:
      - 'v*'

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false
        
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
          packages/desktop/node_modules
          packages/web-host/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'packages/desktop/pnpm-lock.yaml', 'packages/web-host/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
        
    - name: Install dependencies with pnpm
      run: pnpm install --frozen-lockfile --ignore-scripts
      
    - name: Build with memory limits
      working-directory: packages/desktop
      run: |
        Write-Host '🚀 Starting build...' -ForegroundColor Green
        bun run build
        
    - name: Verify installer
      working-directory: packages/desktop
      run: |
        if (Test-Path 'out/AionUi-2.2.2-win-x64.exe') {
          Write-Host '✅ Installer created successfully!' -ForegroundColor Green
        } else {
          Write-Host '❌ ERROR: Installer not found!' -ForegroundColor Red
          Get-ChildItem 'out' -ErrorAction SilentlyContinue | Write-Host
          exit 1
        }
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: AionUi-Windows-Installer
        path: packages/desktop/out/AionUi-2.2.2-win-x64.exe
        retention-days: 7