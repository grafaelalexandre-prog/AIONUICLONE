name: Build Windows Installer

on:
  push:
    branches: [main, 'feat/*']
    tags:
      - 'v*'

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          packages/desktop/node_modules
          packages/web-host/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'packages/desktop/package-lock.json', 'packages/web-host/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
        
    - name: Install dependencies
      run: npm install --ignore-scripts --legacy-peer-deps
      
    - name: Build with memory limits
      working-directory: packages/desktop
      run: |
        Write-Host '🚀 Starting build...' -ForegroundColor Green
        bun run build
        
    - name: Verify installer
      working-directory: packages/desktop
      run: |
        if (Test-Path 'out/AionUi-2.2.2-win-x64.exe') {
          Write-Host '✅ Installer created successfully!' -ForegroundColor Green
        } else {
          Write-Host '❌ ERROR: Installer not found!' -ForegroundColor Red
          Get-ChildItem 'out' -ErrorAction SilentlyContinue | Write-Host
          exit 1
        }
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: AionUi-Windows-Installer
        path: packages/desktop/out/AionUi-2.2.2-win-x64.exe
        retention-days: 7